[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rga-tac"
version = "1.0.0"
description = "Retrieval-graph-augmented tactile description generation."
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = ["numpy<2", "pillow", "sentencepiece"]

[project.optional-dependencies]
tvl = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "timm==0.9.7",
    "open-clip-torch==2.24.0",
    "scikit-learn==1.3.2",
    "PyYAML",
    "pandas",
    "tqdm",
]

[project.scripts]
rga-tac-train = "rga_tac.benchmark.t.rga_tac:main"
rga-tac-prepare = "rga_tac.data.manifest.builder:prepare_main"
rga-tac-demo = "rga_tac.demo:demo_main"

[tool.setuptools.packages.find]
include = ["rga_tac*"]
